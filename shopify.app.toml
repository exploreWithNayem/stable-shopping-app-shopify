# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7678ebc29ace1636fc3db87257ba7629"
name = "easy-recommendation-app"
application_url = "https://logan-newfoundland-literature-albums.trycloudflare.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_orders and read_customer_events are protected customer data scopes and
# require approval in the Partner Dashboard before the app can be listed.
#
# unauthenticated_read_product_listings backs the Storefront API calls that
# fetch Shopify's own product recommendations — the Admin API has no
# productRecommendations query, so this is the only server-side source.
#
# read_orders and read_customer_events are PROTECTED CUSTOMER DATA and are
# withheld until the app is approved (Partner Dashboard → App setup → Protected
# customer data access). Shopify rejects the whole dev preview otherwise. To
# restore revenue attribution, get approval and change this line back to:
#   "read_products,write_products,read_orders,read_customer_events,unauthenticated_read_product_listings"
scopes = "read_products,write_products,unauthenticated_read_product_listings"

# Storefront-readable mirror of a product's manual recommendation override.
# Written by the app whenever an override is saved (see CLAUDE.md Phase 6) so the
# theme app block can render server-side in Liquid without an extra network hop.
# Shape: { "v": 1, "updatedAt": "<iso>", "items": [{ "id": 123, "handle": "…" }] }
[product.metafields.app.reco_overrides]
name = "Recommendation Overrides"
description = "Manual product recommendations that replace the Shopify-generated list"
type = "json"

  [product.metafields.app.reco_overrides.access]
  admin = "merchant_read"
  storefront = "public_read"

# Storefront-readable list of every published *shop-scope* offer — the ones whose
# trigger is "all products" or "products in specific collections" (CLAUDE.md §7.8).
# Those cannot be mirrored per product: a real catalogue would need thousands of
# metafield writes, and each would count against the per-product plan allowance. The
# app embed reads this one on any product page and matches the trigger there, which
# is what makes "all products" include products added after the offer was published.
# Shape: { "v": 1, "updatedAt": "<iso>", "offers": [{ trigger, exclude, source, items, visibility, copy }] }
[shop.metafields.app.reco_offers]
name = "Recommendation Offers"
description = "Offers that apply to a whole catalogue or to collections"
type = "json"

  [shop.metafields.app.reco_offers.access]
  admin = "merchant_read"
  storefront = "public_read"

# Storefront endpoint for the theme block and checkout extension.
# https://<shop>/apps/easy-reco/<path>  ->  <application_url>/proxy/<path>
[app_proxy]
url = "https://logan-newfoundland-literature-albums.trycloudflare.com/proxy"
subpath = "easy-reco"
prefix = "apps"

[webhooks]
api_version = "2026-07"

  # Mandatory GDPR endpoints. Every public app must subscribe to all three or
  # App Store review rejects it, and Shopify probes them with a signed request
  # during review — authenticate.webhook() verifies the HMAC and answers 401 on a
  # bad signature, which is what it is checking for.
  #
  # These take absolute URLs, unlike the relative `uri` on the subscriptions
  # below. Keep them in step with application_url.
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://logan-newfoundland-literature-albums.trycloudflare.com/webhooks/customers/data_request"
  customer_deletion_url = "https://logan-newfoundland-literature-albums.trycloudflare.com/webhooks/customers/redact"
  shop_deletion_url = "https://logan-newfoundland-literature-albums.trycloudflare.com/webhooks/shop/redact"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # A deleted product leaves its override rows behind, holding a slot against
  # the plan's product allowance for something that no longer exists.
  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = [ "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Keeps Shop.plan in sync when a subscription changes outside the app —
  # cancelled from the admin, payment failed, charge expired.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/subscriptions_update"
  topics = [ "app_subscriptions/update" ]

  # Closes the attribution loop: reads the _reco_* line properties the theme
  # block attaches, and books the revenue against the recommendation.
  #
  # DISABLED until the app has protected customer data approval — orders/create
  # carries customer data, and Shopify refuses the whole dev preview with
  # "not approved to subscribe to webhook topics containing protected customer
  # data" while it is declared. The handler and its tests are already written
  # (app/routes/webhooks.orders.create.jsx); uncomment once approved.
  #
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/orders/create"
  # topics = [ "orders/create" ]

[auth]
redirect_urls = [ "https://logan-newfoundland-literature-albums.trycloudflare.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
